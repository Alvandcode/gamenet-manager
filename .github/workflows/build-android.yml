name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Cordova
        run: npm install -g cordova

      - name: Add Android platform
        run: cordova platform add android@latest

      - name: Build Debug APK
        run: cordova build android

      - name: Verify APK
        run: |
          ls -lh platforms/android/app/build/outputs/apk/debug/
          test -f platforms/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamenet-manager-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: GameNet Manager v1.0.${{ github.run_number }}
          body: |
            ## GameNet Manager

            نسخه جدید برنامه مدیریت گیم‌نت الوند.

            ### فایل نصب
            `app-debug.apk`

            این نسخه به صورت خودکار توسط GitHub Actions ساخته شده است.
          files: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true