name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Read app version
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Sanity check (syntax + handlers)
        run: npm run check

      - name: Add Android platform
        run: npx cordova platform add android@13

      - name: Build Debug APK
        run: npx cordova build android

      - name: Verify APK
        run: |
          ls -lh platforms/android/app/build/outputs/apk/debug/
          test -f platforms/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamenet-manager-apk-v${{ env.APP_VERSION }}
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GameNet Manager ${{ github.ref_name }}
          body: |
            ## GameNet Manager

            نسخه جدید برنامه مدیریت گیم‌نت الوند.

            ### فایل نصب
            `app-debug.apk`

            این نسخه به صورت خودکار توسط GitHub Actions ساخته شده است.
          files: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
